# .github/workflows/release.yml
name: Release Extension

on:
  push:
    branches:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read version from branch name
        id: read_version
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          PATTERN='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if ! [[ "$BRANCH" =~ $PATTERN ]]; then
            echo "Branch name '$BRANCH' must follow v{a}.{n}.{c}"
            exit 1
          fi
          for PART in "${BASH_REMATCH[@]:1}"; do
            if [ "$PART" -gt 65535 ]; then
              echo "Version part '$PART' exceeds 65535"
              exit 1
            fi
          done
          VERSION="${BRANCH#v}"
          if [ "$VERSION" = "0.0.0" ]; then
            echo "Version 0.0.0 is rejected by Chrome"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Check if tag already exists
        id: check_tag
        env:
          TAG: v${{ steps.read_version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node.js
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download library
        if: steps.check_tag.outputs.exists == 'false'
        run: npm run setup
      - name: Write version into manifest
        if: steps.check_tag.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.read_version.outputs.version }}
        run: |
          jq --arg version "$VERSION" '.version = $version' blahblahtranslate/manifest.json > manifest.tmp
          mv manifest.tmp blahblahtranslate/manifest.json
      - name: Package extension
        if: steps.check_tag.outputs.exists == 'false'
        env:
          TAG: v${{ steps.read_version.outputs.version }}
        run: |
          mkdir -p dist
          cd blahblahtranslate
          zip -r -X "../dist/blahblahtranslate-$TAG.zip" .
      - name: Create tag and GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.read_version.outputs.version }}
          name: v${{ steps.read_version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/blahblahtranslate-v${{ steps.read_version.outputs.version }}.zip